<section class="w-full max-w-7xl mx-auto px-6 py-16 font-sans text-slate-900">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
    

    <div class="lg:col-span-5 space-y-4">
      <h2 class="text-4xl lg:text-5xl font-extrabold tracking-tight text-slate-950 leading-tight">
        Respondemos tus preguntas
      </h2>
      
      <p class="text-slate-500 text-lg leading-relaxed">
        Todo lo que necesitás saber sobre comprar, vender o coordinar la logística en liquidaciones de departamentos.
      </p>

      <!-- Badge secundario inferior opcional -->
      <div class="pt-4 flex items-center gap-2 text-emerald-700 font-medium text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Soporte y resguardo asegurado por Muvix</span>
      </div>
    </div>

    <div class="lg:col-span-7 divide-y divide-slate-200 border-t border-slate-200">
      @for (faq of faqs; track faq.id; let i = $index) {
        <div class="py-5">
          <button 
            type="button"
            (click)="toggleFaq(i)"
            class="w-full flex justify-between items-center text-left gap-4 font-semibold text-lg text-slate-900 hover:text-slate-700 transition-colors focus:outline-none"
            [attr.aria-expanded]="openIndex() === i">
            <span>{{ faq.question }}</span>
            
            <ng-icon name="heroCheckCircle" />
          </button>

          @if (openIndex() === i) {
            <div class="mt-3 text-slate-600 leading-relaxed pr-6 animate-fadeIn">
              <p>{{ faq.answer }}</p>
            </div>
          }
        </div>
      }
    </div>

  </div>
</section>
