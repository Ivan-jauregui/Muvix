<div
  (click)="onCardClicked()"
  class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-5 hover:border-rose-200 hover:shadow-md transition-all duration-200 w-full cursor-pointer">

  <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-lg bg-gray-50 overflow-hidden flex-shrink-0 border border-gray-100">
    @if (associated_publication().coverImage) {
      <img
        [src]="associated_publication().coverImage"
        [alt]="associated_publication().title"
        class="w-full h-full object-cover" />
    } @else {
      <div class="w-full h-full flex items-center justify-center text-gray-400 text-xs">
        Sin imagen
      </div>
    }
  </div>

  <div class="flex-1 min-w-0">
    <h3 class="text-sm sm:text-base font-extrabold text-gray-900 truncate">
      {{ associated_publication().title }}
    </h3>

    <p class="text-xs text-gray-500 line-clamp-2 mt-1">
      {{ associated_publication().description }}
    </p>

    <span class="text-base font-black text-gray-900 mt-2 block">
      {{ associated_publication().price | currency:'ARS':'symbol-narrow':'1.0-0' }}
    </span>
  </div>

  <div class="text-rose-600 flex-shrink-0">
    <span class="text-xs font-bold">Ver publicación</span>
  </div>
</div>
