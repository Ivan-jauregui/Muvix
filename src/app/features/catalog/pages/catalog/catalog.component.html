<main class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="">


    <div class="flex flex-col lg:flex-row gap-8">


      <publication-filter [categories]="categories" [conditions]="conditions" [selectedCategory]="selectedCategory()"
        [selectedCondition]="condition()" [search]="search()" [maxPrice]="maxPrice()" [minPriceLimit]="minPriceLimit"
        [maxPriceLimit]="maxPriceLimit" [categoryCount]="categoryCount.bind(this)"
        [conditionCount]="conditionCount.bind(this)" (clear)="clearFilters()" (searchChange)="search.set($event)"
        (categoryChange)="selectCategory($event)" (conditionChange)="toggleCondition($event)"
        (priceChange)="maxPrice.set($event)"></publication-filter>

      <section class="flex-grow" aria-labelledby="catalog-title">


        <header class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <h1 id="catalog-title" class="text-3xl font-extrabold text-gray-900 tracking-tight">Explorar Catálogo</h1>

          <div class="flex items-center gap-2 self-end sm:self-auto">
            <label for="sort-by" class="text-xs text-gray-500 font-medium">Ordenar por:</label>
            <select id="sort-by" [value]="sortBy()" (change)="onSort($event)"
              class="text-sm font-medium text-gray-800 bg-transparent border-none focus:ring-0 cursor-pointer pr-8 py-1">
              <option value="newest">Más recientes</option>
              <option value="priceAsc">Menor precio</option>
              <option value="priceDesc">Mayor precio</option>
            </select>
          </div>
        </header>


        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

          @for (item of filtered(); track item.id) {

          <article
            class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group relative cursor-pointer"
            (click)="viewDetails(item.id!)">

            <figure class="relative aspect-[14/10] w-full bg-gray-100 overflow-hidden">
              <img [src]="getMainImageUrl(item)" class="w-full h-full object-cover">
            </figure>

            <div class="p-4 flex flex-col flex-grow">

              <div class="flex items-start justify-between gap-2 mb-1.5">
                <h2
                  class="text-sm font-bold text-gray-900 line-clamp-2 leading-tight group-hover:text-rose-600 transition-colors">
                  {{ item.title }}
                </h2>
                <span
                  class="bg-gray-100 text-gray-500 text-[10px] font-medium px-2 py-0.5 rounded whitespace-nowrap border border-gray-200/50">
                  {{ item.condition }}
                </span>
              </div>

              <p class="text-xs text-gray-500 line-clamp-2 mb-3 flex-grow">
                {{ item.description }}
              </p>

              <div class="flex items-baseline gap-2 mb-2.5">
                <span class="text-xl font-black text-rose-600">${{ item.price | number:'1.0-0' }}</span>
              </div>

              <div class="grid grid-cols-2 gap-2 mt-auto">
                <button
                  class="bg-red-950 hover:bg-red-900 text-white text-xs font-bold py-2 px-3 rounded-lg transition-colors shadow-sm">
                  Comprar Ya
                </button>
                <button
                  class="bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold py-2 px-3 rounded-lg transition-colors">
                  Hacer Oferta
                </button>
              </div>
            </div>
          </article>
          } @empty {

          <div class="col-span-full bg-white rounded-xl border border-gray-200 p-12 text-center">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            <h3 class="mt-4 text-lg font-bold text-gray-900">No hay publicaciones</h3>
            <p class="mt-2 text-sm text-gray-500">No se encontraron productos con estos filtros.</p>
          </div>
          }

        </div>

        <nav class="mt-10 flex justify-center items-center gap-1 text-sm font-medium text-gray-500"
          aria-label="Paginación de resultados">
          <button
            class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-gray-400">
          </button>
