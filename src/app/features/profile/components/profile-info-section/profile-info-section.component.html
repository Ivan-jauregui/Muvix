<section class="flex flex-col md:flex-row md:items-start justify-between gap-4">

  <div class="flex items-start gap-3 sm:gap-5 min-w-0">

  
    <div class="relative shrink-0 -mt-12 sm:-mt-16 md:-mt-[4.5rem]">
      <img
        [src]="user().photo || 'https://picsum.photos/seed/avatar/300/300'"
        alt="Foto de perfil"
        class="w-24 h-24 sm:w-32 sm:h-32 md:w-36 md:h-36 rounded-full object-cover border-4 border-white shadow-md bg-white">
    </div>

   
    <div class="pt-3 space-y-1 min-w-0">
      <div class="flex items-center gap-2 flex-wrap">
        <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold tracking-tight text-slate-900">
          {{ user().firstName }} {{ user().lastName }}
        </h1>
      </div>

      <div class="flex items-center gap-2 text-sm text-gray-500 flex-wrap">
        <span class="text-gray-900 font-semibold">
          <span class="text-amber-500">★</span> 4.9
        </span>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-3 md:pt-3">
    <div class="flex items-center gap-3 bg-white border border-gray-100 rounded-2xl px-4 py-2.5 shadow-sm">
      <div class="leading-tight">
        <p class="text-[10px] font-semibold text-gray-400 tracking-wider uppercase">
          Publicaciones
        </p>
        <p class="text-sm font-bold">{{ totalCount() }} artículos</p>
      </div>
    </div>
  </div>

</section>
