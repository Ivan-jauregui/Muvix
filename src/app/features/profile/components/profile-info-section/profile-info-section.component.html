<section class="-mt-16 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div class="flex items-end gap-5">
        <div class="relative shrink-0">
          <img
            [src]="user().photo || 'https://picsum.photos/seed/avatar/300/300'"
            alt="Foto de perfil"
            class="w-32 h-32 md:w-36 md:h-36 rounded-full object-cover border-4 border-white shadow-md bg-white">

        
        </div>

        <div class="pb-2 space-y-1">
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">
              {{ user().firstName }} {{ user().lastName }}
            </h1>

            <span class="text-xs text-gray-600 bg-gray-100 border border-gray-200 px-2.5 py-1 rounded-full">
              Particular
            </span>
          </div>

          <div class="flex items-center gap-2 text-sm text-gray-500 flex-wrap">
            <span class="text-gray-900 font-semibold">
              <span class="text-amber-500">★</span> 4.9
            </span>
            <span>Vendedor</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 pb-2">
        <div class="flex items-center gap-3 bg-white border border-gray-100 rounded-2xl px-4 py-2.5 shadow-sm">
       
          <div class="leading-tight">
            <p class="text-[10px] font-semibold text-gray-400 tracking-wider uppercase">
              Publicaciones
            </p>
            <p class="text-sm font-bold">{{ totalCount() }} artículos</p>
          </div>
        </div>
      </div>
    </section>
