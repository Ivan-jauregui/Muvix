@if (user(); as u) {
<div class="min-h-screen bg-gray-50 text-gray-900">

  <!-- BANNER -->
  <div class="h-44 md:h-48 bg-gradient-to-r from-rose-500 via-rose-900 to-neutral-900"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">



    <!-- PERFIL -->
    <profile-info-section [user]="u" [totalCount]="totalCount()"></profile-info-section>


    <!-- INVENTARIO -->
    <section class="mt-14 space-y-5">

      <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-gray-200">

        <div class="flex items-baseline gap-3">
          <span class="w-1.5 h-5 bg-gray-900 rounded-full self-center"></span>

          <h2 class="text-xl font-extrabold tracking-tight">
            Inventario y Publicaciones
          </h2>

          <span class="text-sm text-gray-400">
            ({{ totalCount() }} disponibles)
          </span>
        </div>



        <!-- ORDENAR -->
        <div class="flex items-center gap-4 text-sm">
          <label class="flex items-center gap-2 text-gray-400">
            Ordenar por:

            <select (change)="onSort($event)"
              class="bg-transparent text-gray-900 font-semibold focus:outline-none cursor-pointer">

              <option value="newest">Más recientes</option>
              <option value="priceAsc">Menor precio</option>
              <option value="priceDesc">Mayor precio</option>

            </select>
          </label>
        </div>

      </div>
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">



        <!-- FILTROS -->
        <publication-filters [categories]="categories" [conditions]="conditions" [selectedCategory]="selectedCategory()"
          [selectedCondition]="condition()" [search]="search()" [maxPrice]="maxPrice()" [minPriceLimit]="minPriceLimit"
          [maxPriceLimit]="maxPriceLimit" [categoryCount]="categoryCount.bind(this)"
          [conditionCount]="conditionCount.bind(this)" (clear)="clearFilters()" (searchChange)="search.set($event)"
          (categoryChange)="selectCategory($event)" (conditionChange)="toggleCondition($event)"
          (priceChange)="maxPrice.set($event)"></publication-filters>





        <!-- GRILLA DE PUBLICACIONES -->
        <div class="lg:col-span-3">
          @if (filtered().length > 0) {
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
            @for (item of filtered(); track item.id) {
            <publication-card [publication]="item"></publication-card>
            }
          </div>
          } @else {
          <div class="bg-white border border-dashed border-gray-200 rounded-2xl p-10 text-center">
            <h3 class="font-bold text-gray-800">
              No hay publicaciones disponibles
            </h3>
            <p class="text-sm text-gray-500 mt-2">
              No encontramos artículos que coincidan con tus filtros.
            </p>
            <button type="button" (click)="clearFilters()"
              class="block mx-auto mt-4 text-rose-600 font-semibold hover:underline">
              Limpiar filtros
            </button>
          </div>
          }

        </div>
      </div>

    </section>


  </main>

</div>
} @else {
<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="text-center">
    <p class="text-gray-500">Cargando perfil...</p>
  </div>
</div>
}
