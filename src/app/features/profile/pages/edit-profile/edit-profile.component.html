<section class="min-h-screen bg-[#F8F9FC] px-4 py-8 sm:px-6">
  <div class="mx-auto max-w-3xl">

    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Editar perfil</h1>
      <p class="mt-1 text-sm text-gray-500">
        Actualizá tu información personal y de contacto.
      </p>
    </div>

    <form
      [formGroup]="profileForm"
      (ngSubmit)="onSubmit()"
      class="space-y-6">

      <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
        <h2 class="mb-5 text-lg font-semibold text-gray-900">
          Información personal
        </h2>

        <div class="grid gap-5 sm:grid-cols-2">

          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">Nombre</label>
            <input formControlName="firstName" type="text"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">Apellido</label>
            <input formControlName="lastName" type="text"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">Email</label>
            <input formControlName="email" type="email"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">Teléfono</label>
            <input formControlName="phoneNumber" type="tel"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
          </div>

        </div>
      </div>

      <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
        <h2 class="mb-5 text-lg font-semibold text-gray-900">
          Ubicación
        </h2>

        <div class="grid gap-5 sm:grid-cols-2">

          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">País</label>
            <input formControlName="country" type="text"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">Provincia</label>
            <input formControlName="state" type="text"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">Ciudad</label>
            <input formControlName="city" type="text"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-gray-700">Dirección</label>
            <input formControlName="address" type="text"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
          </div>

        </div>
      </div>

      @if (successMessage) {
        <p class="text-sm font-medium text-green-600">{{ successMessage }}</p>
      }

      @if (errorMessage) {
        <p class="text-sm font-medium text-red-600">{{ errorMessage }}</p>
      }

      <div class="flex justify-end">
        <button type="submit"
          [disabled]="loading"
          class="rounded-xl bg-rose-500 px-6 py-3 font-semibold text-white transition hover:bg-rose-600 disabled:cursor-not-allowed disabled:opacity-50">
          {{ loading ? 'Guardando...' : 'Guardar cambios' }}
        </button>
      </div>

    </form>
  </div>
</section>
