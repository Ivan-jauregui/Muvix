<article class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group relative transition-all duration-300 hover:shadow-md hover:border-gray-200"
    [class.opacity-65]="!publication()?.active"
    (click)="viewDetails(publication()?.id!)">


  <figure class="relative aspect-[4/3] w-full bg-gray-100 overflow-hidden group/image">

    <img [src]="getMainImageUrl(publication()!)" 
         class="w-full h-full object-cover transition-transform duration-500 group-hover/image:scale-105"
         [class.grayscale]="!publication()?.active"
         alt="Publicación">


    <span class="absolute top-3 left-3 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold shadow-sm backdrop-blur-md transition-all duration-200"
          [class]="publication()?.active ? 'bg-emerald-500/90 text-white' : 'bg-amber-500/90 text-white'">
        {{ publication()?.active ? 'Activo' : 'Pausado' }}
    </span>

    <div class="absolute top-3 right-3 flex items-center gap-1.5">
        

        <button (click)="$event.stopPropagation(); toggleStatus()"
                type="button"
                title="Cambiar estado"
                class="inline-flex items-center justify-center p-2 rounded-full text-white shadow-sm backdrop-blur-md transition-all duration-200 active:scale-90"
                [class]="publication()?.active 
                    ? 'bg-black/40 hover:bg-amber-500/90' 
                    : 'bg-black/40 hover:bg-emerald-500/90'">
            <ng-icon [name]="publication()?.active ? 'heroPauseCircleMicro' : 'heroPlayCircleMicro'" size="1.1rem" />
        </button>


        <button 
                type="button"
                title="Editar publicación"
                class="inline-flex items-center justify-center p-2 rounded-full bg-black/40 hover:bg-rose-600/90 text-white shadow-sm backdrop-blur-md transition-all duration-200 active:scale-90">
            <ng-icon name="heroPencilMicro" size="1.1rem" />
        </button>

    </div>
</figure>


    <div class="p-5 flex flex-col flex-grow">
        <div class="flex items-start justify-between gap-3 mb-2">
            <h2 class="text-base font-bold text-gray-900 line-clamp-2 leading-tight group-hover:text-rose-600 transition-colors"
                [class.line-through]="!publication()?.active"
                [class.text-gray-400]="!publication()?.active">
                {{ publication()?.title }}
            </h2>
            <span class="bg-gray-100 text-gray-500 text-[10px] font-medium px-2 py-0.5 rounded whitespace-nowrap border border-gray-200/50">
                {{ publication()?.condition }}
            </span>
        </div>

        <!-- Descripción -->
        <p class="text-xs text-gray-500 line-clamp-2 mb-4 flex-grow">
            {{ publication()?.description }}
        </p>

        <!-- Precio -->
        <div class="flex items-baseline gap-2 mb-4">
            <span class="text-2xl font-black transition-colors"
                  [class]="publication()?.active ? 'text-rose-600' : 'text-gray-400'">
                ${{ publication()?.price | number:'1.0-0' }}
            </span>
        </div>

    
    </div>
</article>
