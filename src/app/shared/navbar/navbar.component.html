
<header class="sticky top-0 z-50 border-b border-gray-100 bg-white">
  <nav class="mx-auto flex h-16 max-w-7xl items-center gap-6 px-4 sm:px-6 lg:px-8">


    <a
      routerLink="/"
      class="shrink-0 text-2xl font-extrabold tracking-tight text-[#212121]"
    >
      MUVI<span class="text-[#A31533]">X</span>
    </a>

    <ul class="hidden shrink-0 items-center gap-5 text-sm font-medium text-gray-600 lg:flex">

      <li>
        <a routerLink="/how-it-works"
           routerLinkActive="!text-[#A31533]"
           class="whitespace-nowrap transition-colors hover:text-[#A31533]">
          Cómo funciona
        </a>
      </li>

      <li>
        <a routerLink="/catalog"
           routerLinkActive="!text-[#A31533]"
           class="whitespace-nowrap transition-colors hover:text-[#A31533]">
          Explorar
        </a>
      </li>

    </ul>


    <div class="relative mx-auto hidden min-w-0 max-w-md flex-1 md:block">

      <ng-icon
        name="heroMagnifyingGlass"
        class="absolute left-4 top-1/2 -translate-y-1/2 text-lg text-gray-400"
      />

      <input
        type="text"
        placeholder="Buscar muebles o publicaciones..."
        class="w-full rounded-full border border-gray-200 bg-gray-50 py-2.5 pl-11 pr-4 text-sm outline-none transition focus:border-[#A31533] focus:bg-white focus:ring-2 focus:ring-[#A31533]/10"
      />

    </div>


    <div class="ml-auto flex shrink-0 items-center gap-2">

   
      <a
        routerLink="/auth/login"
        class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-gray-700 transition hover:bg-gray-100 hover:text-[#A31533]"
      >
        <ng-icon name="heroCalendarDays" class="text-lg" />
        <span class="hidden xl:inline">Mis reservas</span>
      </a>

      <!-- Crear liquidación -->
      <a
        routerLink="/dashboard"
        class="inline-flex items-center gap-2 rounded-full bg-[#A31533] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#821028]"
      >
        <ng-icon name="heroPlus" class="text-lg" />
        <span class="whitespace-nowrap">Crear liquidación</span>
      </a>

    </div>

  </nav>

  <!-- Buscador mobile -->
  <div class="border-t border-gray-100 px-4 py-3 md:hidden">
    <div class="relative">

      <ng-icon
        name="heroMagnifyingGlass"
        class="absolute left-4 top-1/2 -translate-y-1/2 text-lg text-gray-400"
      />

      <input
        type="text"
        placeholder="Buscar muebles o publicaciones..."
        class="w-full rounded-full border border-gray-200 bg-gray-50 py-2.5 pl-11 pr-4 text-sm outline-none focus:border-[#A31533] focus:ring-2 focus:ring-[#A31533]/10"
      />

    </div>
  </div>

</header>
