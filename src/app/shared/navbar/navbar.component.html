<header class="sticky top-0 z-50 border-b border-gray-100 bg-white">
  <nav class="mx-auto grid h-16 max-w-7xl grid-cols-[1fr_auto_1fr] items-stretch gap-4 px-4 sm:px-6 lg:px-8">

    <div class="flex min-w-0 items-center gap-4">
      <a routerLink="/" class="shrink-0 text-2xl font-extrabold tracking-tight text-[#212121]">
        Muvi<span class="text-[#E11D48]">x</span>
      </a>

      <div class="relative hidden min-w-0 max-w-xs flex-1 md:block">
        <ng-icon name="heroMagnifyingGlass"
          class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-lg text-gray-400" />
        <input type="text" placeholder="Buscar en Muvix..."
          class="w-full rounded-full bg-[#EEF1F8] py-2.5 pl-11 pr-4 text-sm text-gray-700 outline-none transition placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-[#E11D48]/20" />
      </div>
    </div>

    <ul class="hidden h-full items-stretch gap-2 md:flex">

      <li class="h-full">
        <a routerLink="/home" routerLinkActive="active"
          [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }"
          class="nav-link" aria-label="Inicio" title="Inicio">
          <span class="nav-pill">
            <ng-icon name="heroHome" class="ico-off text-[28px]" />
            <ng-icon name="heroHomeSolid" class="ico-on text-[28px]" />
          </span>
        </a>
      </li>

      @if (authService.currentUser()) {
        <li class="h-full">
          <a routerLink="/catalog" routerLinkActive="active"
            class="nav-link" aria-label="Explorar" title="Explorar">
            <span class="nav-pill relative">
              <ng-icon name="heroFilm" class="ico-off text-[28px]" />
              <ng-icon name="heroFilmSolid" class="ico-on text-[28px]" />
            </span>
          </a>
        </li>

        <li class="h-full">
          <a routerLink="/dashboard" routerLinkActive="active"
            class="nav-link" aria-label="Perfil" title="Perfil">
            <span class="nav-pill">
              <ng-icon name="heroUserCircle" class="ico-off text-[28px]" />
              <ng-icon name="heroUserCircleSolid" class="ico-on text-[28px]" />
            </span>
          </a>
        </li>

      } @else {
        <li class="h-full">
          <a routerLink="/how-it-works" routerLinkActive="active"
            class="nav-link" aria-label="Cómo funciona" title="Cómo funciona">
            <span class="nav-pill gap-2">
              <ng-icon name="heroQuestionMarkCircle" class="ico-off text-[26px]" />
              <ng-icon name="heroQuestionMarkCircleSolid" class="ico-on text-[26px]" />
              <span class="hidden whitespace-nowrap text-sm font-semibold lg:inline">Cómo funciona</span>
            </span>
          </a>
        </li>

        <li class="h-full">
          <a routerLink="/catalog" routerLinkActive="active"
            class="nav-link" aria-label="Explorar" title="Explorar">
            <span class="nav-pill gap-2">
              <ng-icon name="heroFilm" class="ico-off text-[26px]" />
              <ng-icon name="heroFilmSolid" class="ico-on text-[26px]" />
              <span class="hidden whitespace-nowrap text-sm font-semibold lg:inline">Explorar</span>
            </span>
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center justify-end gap-2">
      @if (authService.currentUser()) {

        <a routerLink="/my-reservations" aria-label="Mis reservas"
          class="relative flex h-11 w-11 items-center justify-center rounded-full bg-gray-100 text-gray-700 transition hover:bg-gray-200">
          <ng-icon name="heroTicket" class="text-xl" />
        </a>

        <button type="button" aria-label="Boxes"
          class="hidden h-11 w-11 items-center justify-center rounded-full bg-gray-100 text-gray-700 transition hover:bg-gray-200 sm:flex">
          <ng-icon name="heroSquares2x2" class="text-xl" />
        </button>

        <button type="button" aria-label="Notificaciones"
          class="relative flex h-11 w-11 items-center justify-center rounded-full bg-gray-100 text-gray-700 transition hover:bg-gray-200">
          <ng-icon name="heroBell" class="text-xl" />
        </button>

        <span class="mx-1 hidden h-7 w-px bg-gray-200 sm:block"></span>

        <button type="button" aria-label="Cuenta"
          class="flex items-center gap-1 rounded-full py-1 pl-1 pr-2.5 transition hover:bg-gray-100">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-[#0F172A] text-white">
            <ng-icon name="heroUserSolid" class="text-lg" />
          </span>
          <ng-icon name="heroChevronDown" class="text-sm text-gray-500" />
        </button>

      } @else {
        <button type="button" (click)="openLogin()"
          class="inline-flex items-center rounded-full bg-[#E11D48] px-5 py-2.5 text-sm font-bold text-white transition hover:bg-[#BE123C]">
          Iniciar sesión
        </button>

        <button type="button" (click)="openRegister()"
          class="hidden items-center rounded-full bg-[#EEF1F8] px-5 py-2.5 text-sm font-semibold text-gray-800 transition hover:bg-gray-200 sm:inline-flex">
          Registrarse
        </button>
      }
    </div>

  </nav>

  <div class="border-t border-gray-100 px-4 py-3 md:hidden">
    <div class="relative">
      <ng-icon name="heroMagnifyingGlass"
        class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-lg text-gray-400" />
      <input type="text" placeholder="Buscar en Muvix..."
        class="w-full rounded-full bg-[#EEF1F8] py-2.5 pl-11 pr-4 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-[#E11D48]/20" />
    </div>
  </div>
</header>

<app-login-modal
  [open]="showLogin()"
  (closed)="closeLogin()"
  (login)="login($event)"
  (forgotPassword)="recoverPassword($event)"
  (register)="register()"
/>

<app-register-modal
  [open]="showRegister()"
  (closed)="showRegister.set(false)"
  (submitted)="createAccount($event)"
  (login)="openLogin()"
/>
